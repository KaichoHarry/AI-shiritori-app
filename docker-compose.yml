services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: shiritori
      POSTGRES_PASSWORD: shiritori
      POSTGRES_DB: shiritori
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # backend/postgres は同一Dockerネットワーク内なので、
      # .envのDATABASE_URLがlocalhostを指していてもここで上書きする
      DATABASE_URL: postgres://shiritori:shiritori@postgres:5432/shiritori?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    # TODO: バックエンド実装後、ヘルスチェックやマイグレーション自動実行の要否を検討する

  frontend:
    build:
      context: ./frontend
      # NEXT_PUBLIC_*はNext.jsのビルド時に静的に埋め込まれる値のため、`environment:`
      # (コンテナ実行時の環境変数)ではなくビルド時の`args`として渡す必要がある。
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
